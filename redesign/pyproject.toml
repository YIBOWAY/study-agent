[project]
name = "study-agent-redesign"
version = "0.1.0"
description = "Clean-room redesign of the Study Agent learning and research workbench project."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = [
  "apps/api/src",
  "packages/research_core/src",
]
testpaths = [
  "tests",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
