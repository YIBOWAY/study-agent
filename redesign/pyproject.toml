[project]
name = "study-agent-redesign"
version = "0.1.0"
description = "Clean-room redesign of the Study Agent learning and research workbench project."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5",
]
langchain-course = [
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "python-dotenv>=1.0",
]
langgraph-course = [
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "apps/api/src",
  "packages/research_core/src",
  "packages/langchain_course/src",
  "packages/langgraph_course/src",
]
testpaths = [
  "tests",
]
markers = [
  "integration: hits live network/API; skipped unless RUN_DEEPSEEK_TESTS=1",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
